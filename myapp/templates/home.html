<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hello World</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;500;700&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Prompt', sans-serif;
      margin: 0;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
    }

    .hero {
      min-height: calc(100vh - 76px);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .card {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(15px);
      border: none;
      border-radius: 20px;
      padding: 40px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      animation: fadeIn 1.2s ease;
    }

    h1 {
      font-size: 3rem;
      font-weight: 700;
      margin-bottom: 10px;
    }

    p {
      opacity: 0.8;
    }

    .btn-custom {
      margin-top: 20px;
      border-radius: 50px;
      padding: 10px 25px;
      transition: 0.3s;
    }

    .btn-custom:hover {
      transform: scale(1.05);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .navbar {
      background: rgba(0, 0, 0, 0.15);
    }
  </style>
</head>

<body>

  <!-- ===== Navbar หลักของเว็บไซต์ ใช้ร่วมกันทุกหน้า (home/about/products/product-detail) ===== -->
  <nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container">
      <a class="navbar-brand fw-bold" href="{% url 'home' %}">🛒 MyShop</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navMenu">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item"><a class="nav-link" href="{% url 'home' %}">หน้าแรก</a></li>
          <li class="nav-item"><a class="nav-link" href="{% url 'all-products' %}">สินค้าทั้งหมด</a></li>
          <li class="nav-item"><a class="nav-link" href="{% url 'about' %}">เกี่ยวกับเรา</a></li>
        </ul>
        <ul class="navbar-nav">
          {% if user.is_authenticated %}
          <li class="nav-item"><a class="nav-link" href="{% url 'profile' %}">👤 {{ user.username }}</a></li>
          <li class="nav-item"><a class="nav-link" href="{% url 'logout' %}">ออกจากระบบ</a></li>
          {% else %}
          <li class="nav-item"><a class="nav-link" href="{% url 'login' %}">เข้าสู่ระบบ</a></li>
          <li class="nav-item"><a class="nav-link" href="{% url 'register' %}">สมัครสมาชิก</a></li>
          {% endif %}
        </ul>
      </div>
    </div>
  </nav>

  <div class="hero">
    <div class="card">
      <h1>Hello Uncle Engineer 🌍</h1>
      <p>ยินดีต้อนรับสู่หน้าเว็บแรกของคุณ</p>
      <a href="{% url 'all-products' %}" class="btn btn-light btn-custom">ดูสินค้าทั้งหมด</a>
      <button class="btn btn-outline-light btn-custom" onclick="changeText()">คลิกฉัน</button>
    </div>
  </div>

  <script>
    function changeText() {
      document.querySelector("h1").innerText = "สวัสดีโลกจ้าาาาา 😄😄😄";
    }
  </script>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
