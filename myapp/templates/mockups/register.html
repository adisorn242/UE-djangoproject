<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>สร้างบัญชีใหม่ - Mockup</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --bg-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --glass-bg: rgba(255, 255, 255, 0.9);
            --text-main: #1f2937;
            --text-muted: #6b7280;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Prompt', sans-serif;
            background: var(--bg-gradient);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .register-container {
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            padding: 2.5rem;
            border-radius: 20px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            width: 100%;
            max-width: 450px;
        }

        h2 { color: var(--text-main); margin-bottom: 0.5rem; text-align: center; font-weight: 600; font-size: 1.8rem; }
        .subtitle { text-align: center; color: var(--text-muted); margin-bottom: 2rem; font-size: 0.95rem; }
        .form-group { margin-bottom: 1.25rem; }
        label { display: block; margin-bottom: 0.5rem; color: var(--text-main); font-weight: 500; font-size: 0.9rem; }
        input { width: 100%; padding: 12px 16px; border: 2px solid #e5e7eb; border-radius: 12px; font-size: 1rem; }
        button { width: 100%; padding: 14px; background-color: var(--primary); color: white; border: none; border-radius: 12px; cursor: pointer; font-size: 1rem; font-weight: 600; margin-top: 1rem; }
        .footer-text { text-align: center; margin-top: 2rem; font-size: 0.95rem; color: var(--text-muted); }
        .footer-text a { color: var(--primary); text-decoration: none; font-weight: 600; }
    </style>
</head>
<body>

<div class="register-container">
    <h2>สร้างบัญชีใหม่</h2>
    <p class="subtitle">เข้าร่วมเป็นส่วนหนึ่งกับเราวันนี้</p>

    <form action="#">
        <div class="form-group">
            <label>ชื่อผู้ใช้งาน</label>
            <input type="text" placeholder="กรอกชื่อผู้ใช้งาน">
        </div>
        <div class="form-group">
            <label>อีเมล</label>
            <input type="email" placeholder="example@email.com">
        </div>
        <div class="form-group">
            <label>รหัสผ่าน</label>
            <input type="password" placeholder="••••••••">
        </div>
        <div class="form-group">
            <label>ยืนยันรหัสผ่าน</label>
            <input type="password" placeholder="••••••••">
        </div>

        <button type="button">ลงทะเบียน</button>
    </form>

    <div class="footer-text">
        มีบัญชีอยู่แล้ว? <a href="login.html">เข้าสู่ระบบ</a>
    </div>
</div>

</body>
</html>
